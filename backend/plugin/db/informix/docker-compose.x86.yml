version: '3.8'

services:
  informix-odbc-x86:
    build: 
      context: .
      dockerfile: Dockerfile.x86
    container_name: informix-odbc-x86
    platform: linux/amd64
    volumes:
      - ../odbc:/app/odbc-source
      - ../:/app/tests
      - ./scripts:/app/scripts
      - ./downloads:/app/downloads
    networks:
      - informix-net
    depends_on:
      - informix-db
    environment:
      - INFORMIX_HOST=informix-db
      - INFORMIX_PORT=9088
      - INFORMIX_DATABASE=order
      - INFORMIX_USER=informix
      - INFORMIX_PASSWORD=in4mix
      - INFORMIXSERVER=informix_tcp
      - INFORMIXDIR=/opt/IBM/informix
    command: tail -f /dev/null
    stdin_open: true
    tty: true

  informix-db:
    image: icr.io/informix/informix-developer-database:latest
    container_name: informix-db-x86
    platform: linux/amd64
    ports:
      - "9092:9088"
      - "9093:9089"
    environment:
      - LICENSE=accept
      - STORAGE=local
    volumes:
      - informix-data-x86:/opt/ibm/data
    networks:
      - informix-net

networks:
  informix-net:
    driver: bridge

volumes:
  informix-data-x86: