version: '3.8'

services:
  # PostgreSQL for Bytebase metadata
  postgres:
    image: postgres:15
    container_name: bytebase-postgres
    environment:
      POSTGRES_USER: bbdev
      POSTGRES_PASSWORD: bbdev
      POSTGRES_DB: bbdev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bytebase-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbdev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Basic Bytebase without Informix
  bytebase:
    build:
      context: .
      dockerfile: docker/Dockerfile.basic
    container_name: bytebase-basic
    ports:
      - "8080:8080"
    environment:
      # Use PostgreSQL for metadata storage
      PG_URL: postgresql://bbdev:bbdev@postgres:5432/bbdev
    volumes:
      - bytebase-data:/var/opt/bytebase
    networks:
      - bytebase-net
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--data", "/var/opt/bytebase", "--port", "8080", "--pg", "postgresql://bbdev:bbdev@postgres:5432/bbdev", "--debug"]

networks:
  bytebase-net:
    driver: bridge

volumes:
  postgres-data:
  bytebase-data: